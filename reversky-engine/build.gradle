plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'it.downfall'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Swagger, stessa versione dell'API (D-41)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	// I test di bilanciamento sono lenti: si lanciano a mano con balanceTest (ENG-28) ed effectTest (ENG-42, docs/test)
	useJUnitPlatform {
		excludeTags 'balance', 'effects'
	}
}

tasks.register('balanceTest', Test) {
	description = 'Simulazione di bilanciamento (ENG-28): scrive il report in docs/bilanciamento.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'balance'
	}
	systemProperty 'balance.outputDir', file('docs/bilanciamento').absolutePath
	// Griglia da simulare: base (default), forme o pv30, con -PbalanceGrid=<nome> (BalanceGrid)
	systemProperty 'balance.grid', findProperty('balanceGrid') ?: 'base'
	// Il report dipende dal codice dell'engine e dal catalogo: si rigenera a ogni lancio
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
}

tasks.register('effectTest', Test) {
	description = 'Valore di ogni effetto a partite appaiate (ENG-42): scrive report-effetti.md in docs/bilanciamento.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'effects'
	}
	systemProperty 'balance.outputDir', file('docs/bilanciamento').absolutePath
	// Il report dipende dal codice dell'engine e dal catalogo: si rigenera a ogni lancio
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
}
