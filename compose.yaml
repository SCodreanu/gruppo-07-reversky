# Reversky — avvio di tutto il progetto: database, engine, API e web.
#   docker compose up --build
# Web: http://localhost:3000 · Swagger: http://localhost:8080/swagger-ui.html · email: http://localhost:8025
# I valori si possono cambiare in un file .env (vedi .env.example).

name: reversky

services:

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reversky}
      POSTGRES_USER: ${POSTGRES_USER:-reversky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reversky}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"       # per collegarsi da DBeaver/pgAdmin
    volumes:
      - db-data:/var/lib/postgresql          # da Postgres 18 il volume va qui
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    expose:
      - "1025"                               # SMTP, raggiungibile solo dall'API
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"      # email ricevute: http://localhost:8025

  engine:
    build: ./reversky-engine
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
    expose:
      - "8081"                               # raggiungibile solo dall'API, non dall'esterno
    # ports:
    #   - "8081:8081"                        # scommentare per provarlo da Swagger/Postman

  api:
    build: ./reversky-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}  # dev = dati di prova alice/bob/admin (docs/database)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-reversky}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-reversky}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reversky}
      REVERSKY_ENGINE_BASEURL: http://engine:8081              # reversky.engine.base-url
      REVERSKY_SECURITY_JWTSECRET: ${JWT_SECRET:-dev-only-secret-change-me-at-least-32-chars}  # reversky.security.jwt-secret
      SPRING_MAIL_HOST: mailpit                                # spring.mail.host
      SPRING_MAIL_PORT: 1025                                   # spring.mail.port
      IMAGES_DIR: /app/uploads                                 # reversky.storage.images-dir (API-14)
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - images:/app/uploads                  # illustrazioni caricate dal backoffice, servite su /images/**

  web:
    build: ./reversky-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      REVERSKY_API_URL: http://api:8080                        # solo il server Next chiama l'API (BFF)
      REVERSKY_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}      # true solo dietro HTTPS: qui il web è su http
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Seed delle illustrazioni delle carte, solo con il profilo dev: carica come admin le immagini di
  # "docs/Carte definitive" (vedi mappa-carte.csv) sulle carte che non ne hanno ancora una, poi si ferma.
  seed-images:
    build: ./scripts/seed-immagini
    restart: "no"
    depends_on:
      api:
        condition: service_started
    environment:
      API_URL: http://api:8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      FORCE: ${SEED_IMAGES_FORCE:-0}                           # 1 = ricarica anche le carte che hanno già l'immagine
    volumes:
      - "./docs/Carte definitive:/carte:ro"

volumes:
  db-data:
  images:
