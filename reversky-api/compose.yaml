# Database e server email per lo sviluppo locale con ./gradlew bootRun.
# Spring Boot (spring-boot-docker-compose) li avvia da solo; al database si collega in automatico.
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=reversky'
      - 'POSTGRES_USER=reversky'
      - 'POSTGRES_PASSWORD=reversky'
    ports:
      - '5432'

  # Finto server SMTP: cattura le email inviate dall'API senza spedirle davvero.
  # Le email si leggono su http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'          # SMTP: qui l'API invia le email (spring.mail.port)
      - '8025:8025'          # interfaccia web per leggerle
