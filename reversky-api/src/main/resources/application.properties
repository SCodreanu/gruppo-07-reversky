spring.application.name=reversky-api

# Database
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# Security
reversky.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
reversky.security.access-token-ttl=15m
reversky.security.refresh-token-ttl=30d
reversky.security.password-reset-token-ttl=30m
reversky.security.email-verification-token-ttl=24h
reversky.security.allowed-origins=http://localhost:3000

# Email (in sviluppo arrivano a Mailpit: http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025
reversky.mail.from=Reversky <noreply@reversky.local>

# Timeout in millisecondi: se il server SMTP non risponde la richiesta non resta appesa
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Pagine del frontend che ricevono il token come ?token=... [DA CONFERMARE con il team WMD]
reversky.mail.verify-email-url=http://localhost:3000/verify-email
reversky.mail.reset-password-url=http://localhost:3000/reset-password

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Paginazione (docs/api-rest): ?page=0&size=20; oltre max-page-size Spring usa il massimo
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
