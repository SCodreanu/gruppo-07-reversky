# Configurazione aggiunta dei test. Spring legge anche classpath:/config/application.properties e lo somma a
# src/main/resources/application.properties, con la precedenza su quello. Non spostarlo nella radice di
# src/test/resources: un application.properties lì sostituirebbe quello principale invece di sommarsi.

# Abbinamento della coda classificata spento (API-49): niente job ogni 2 secondi né tentativo dopo l'ingresso in coda,
# così i test della coda non vengono abbinati mentre girano. I test dell'abbinamento chiamano MatchmakingService.
reversky.matchmaking.enabled=false
